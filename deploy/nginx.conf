# ==============================================================================
# NV Cyclothon 2026 - High Performance Nginx Configuration
# Optimized for 200 GB VPS (Frontend + Node.js API + Docker PostgreSQL)
# ==============================================================================

# Rate limiting zones to prevent volumetric attacks & brute-force
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_uploads:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

upstream node_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name nvcyclothon.in www.nvcyclothon.in;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force HTTPS in production
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nvcyclothon.in www.nvcyclothon.in;

    # SSL Configuration (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nvcyclothon.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nvcyclothon.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Performance optimizations: Zero-copy kernel sendfile
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # 1. ZERO-OVERHEAD HIGH-SPEED MEDIA SERVING (Bypasses Node.js completely)
    # Serves optimized WebP photos, SVGs, and documents directly from VPS disk.
    # --------------------------------------------------------------------------
    location /api/media/ {
        alias /var/www/nv_cyclothon/uploads/;
        
        # 1-year immutable caching for static media (zero repeat server load)
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # Prevent execution of any scripts in upload directory
        location ~* \.(php|pl|py|jsp|sh|cgi)$ {
            return 403;
        }

        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 2. FRONTEND STATIC ASSETS (Vite build output)
    # --------------------------------------------------------------------------
    root /var/www/nv_cyclothon/client/dist;
    index index.html;

    # Hashed Vite assets can be cached aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Single Page Application fallback for React router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 3. UPLOAD ENDPOINT (Protected with stricter upload rate limit)
    # --------------------------------------------------------------------------
    location = /api/uploads/image {
        limit_req zone=api_uploads burst=10 nodelay;
        limit_conn addr_conn 5;

        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 4. GENERAL API REVERSE PROXY (Node.js Express backend)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        limit_conn addr_conn 20;

        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
